    <radialGradient id="halo"><stop stop-color="#1e9bb5" stop-opacity=".25"/><stop offset="1" stop-color="#07111e" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
