<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" role="img" aria-labelledby="title desc">
  <title id="title">WEDJAT-X astronaut monitoring illustration</title>
  <desc id="desc">A stylized astronaut in a pressure suit, framed by cyan orbital rings.</desc>
  <defs>
